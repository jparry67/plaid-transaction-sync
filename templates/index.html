<!DOCTYPE html>
<html>
<head>
  <title>Plaid Sync</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-top: 0; }
    .nav { display: flex; gap: 16px; margin-bottom: 24px; }
    .nav a { padding: 8px 16px; text-decoration: none; color: #333; border-bottom: 2px solid transparent; }
    .nav a.active { border-bottom-color: #333; }
    button { margin: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #status { margin-top: 16px; }
    .success { color: green; }
    .error { color: red; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #ddd; }
    th { background: #f5f5f5; }
    section { display: none; }
    section.visible { display: block; }

    /* History table */
    .history-table tr.success-row { background-color: #d4edda; }
    .history-table tr.failure-row  { background-color: #f8d7da; }
    .history-table tr.queued-row       { background-color: #ccc; }
    .history-table tr.in-progress-row  { background-color: #fff3cd; border-color: #333; border-style: solid; box-sizing: border-box; }
    .history-table tr.in-progress-row td { font-weight: bold; }
    .history-table tr:hover td { background-color: rgba(0,0,0,0.05); }
    .history-toggle { background: none; border: none; cursor: pointer; padding: 0; margin-right: 4px; font-size: 14px; }
    .history-details { display: none; padding: 4px 12px 8px 24px; font-size: 12px; color: #555; }
    .history-details.visible { display: block; }
    .history-details li { margin: 2px 0; list-style: none; font-size: 12px; }
    .history-details li::before { content: '→ '; color: #888; }
    .history-timestamp { white-space: nowrap; font-size: 12px; color: #777; }
  </style>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body>
  <h1>Plaid Sync</h1>
  <div class="nav">
    <a href="/sync" data-page="sync">Sync</a>
    <a href="/accounts" data-page="accounts">Accounts</a>
  </div>

  <!-- Sync -->
  <section id="page-sync">
    <h1>Sync Transactions</h1>
    <table id="account-table" style="display:none;">
      <thead><tr><th>Account</th></tr></thead>
      <tbody></tbody>
    </table>
    <button id="sync-all">Sync all accounts</button>
    <div id="status"></div>

    <h2>Sync History</h2>
    <table class="history-table" id="history-table" style="display:none;">
      <thead><tr><th></th><th>Timestamp</th><th>Account</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Accounts -->
  <section id="page-accounts">
    <h1>Linked Accounts</h1>
    <table id="account-table" style="display:none;">
      <thead><tr><th>Account</th></tr></thead>
      <tbody></tbody>
    </table>
    <button id="open-link">Add account</button>
    <div id="status"></div>
  </section>

  <script>
    // ---- Navigation ----
    const route = window.location.pathname;
    document.querySelectorAll('.nav a').forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === route);
    });

    function showPage(pageId) {
      document.querySelectorAll('section').forEach(s => s.classList.remove('visible'));
      const target = document.getElementById('page-' + pageId);
      if (target) target.classList.add('visible');
      document.querySelectorAll('.nav a').forEach(a => {
        a.classList.toggle('active', a.getAttribute('data-page') === pageId);
      });
      window.dispatchEvent(new CustomEvent('page:' + pageId));
    }

    const pageMap = { '/': 'sync', '/sync': 'sync', '/accounts': 'accounts' };

    // Handle nav clicks (prevent full reload)
    document.querySelectorAll('.nav a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        const pageId = a.getAttribute('data-page');
        window.history.pushState(null, '', a.getAttribute('href'));
        showPage(pageId);
      });
    });

    // Handle back/forward
    window.addEventListener('popstate', () => {
      const pageId = pageMap[window.location.pathname] || 'sync';
      showPage(pageId);
    });

    // ---- Sync page: account list + history ----
    window.addEventListener('page:sync', () => {
      renderSyncAccounts();
      renderHistory();
    });

    async function renderSyncAccounts() {
      const res = await fetch('/api/accounts');
      const accounts = await res.json();
      const tbody = document.querySelector('#page-sync #account-table tbody');
      const table = document.querySelector('#page-sync #account-table');
      tbody.innerHTML = '';
      if (accounts.length > 0) {
        table.style.display = '';
        for (const a of accounts) {
          const tr = document.createElement('tr');
          const tdName = document.createElement('td');
          tdName.textContent = `${a.institution} - ${a.name} (${a.mask})`;
          tr.appendChild(tdName);
          const btn = document.createElement('button');
          btn.textContent = 'Sync';
          btn.addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Request sync for ' + a.name;
            statusEl.className = '';
            try {
              const res = await fetch('/api/sync/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ account_id: a.account_id })
              });
              if (res.ok) {
                watchForComplete();
              } else {
                const data = await res.json();
                statusEl.textContent = data.message || 'Sync failed';
                statusEl.className = 'error';
              }
            } catch (err) {
              statusEl.textContent = 'Error: ' + err.message;
              statusEl.className = 'error';
            }
          });
          tr.appendChild(btn);
          tbody.appendChild(tr);
        }
      } else {
        table.style.display = 'none';
      }
    }

    // ---- Accounts page: table with delete button ----
    window.addEventListener('page:accounts', () => { renderAccounts(); });

    async function renderAccounts() {
      const res = await fetch('/api/accounts');
      const accounts = await res.json();
      const tbody = document.querySelector('#page-accounts #account-table tbody');
      const table = document.querySelector('#page-accounts #account-table');
      tbody.innerHTML = '';
      if (accounts.length > 0) {
        table.style.display = '';
        for (const a of accounts) {
          const tr = document.createElement('tr');
          const tdName = document.createElement('td');
          tdName.textContent = `${a.institution} - ${a.name} (${a.mask})`;
          tr.appendChild(tdName);
          const btn = document.createElement('button');
          btn.textContent = '×';
          btn.style.marginLeft = '12px';
          btn.addEventListener('click', async () => {
            try {
              await fetch(`/api/accounts?account_id=${a.account_id}`, { method: 'DELETE' });
              renderAccounts();
            } catch (err) {
              console.error('Failed to delete account:', err);
            }
          });
          tr.appendChild(btn);
          tbody.appendChild(tr);
        }
      } else {
        table.style.display = 'none';
      }
    }

    document.getElementById('open-link').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.textContent = 'Linking accounts…';
      status.className = '';
      try {
        const res = await fetch('/api/accounts/link-token', { method: 'POST' });
        const { link_token } = await res.json();
        const handler = Plaid.create({
          token: link_token,
          onSuccess: async (public_token, metadata) => {
            try {
              const accountsData = {
                public_token,
                accounts: metadata.accounts,
                institution: metadata.institution ? metadata.institution.name : null,
              };
              const addAccountResponse = await fetch('/api/accounts/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(accountsData)
              });
              if (addAccountResponse.ok) {
                status.textContent = `${metadata.accounts.map(a => a.name).join(', ')} linked successfully!`;
                status.className = 'success';
                renderAccounts();
              } else {
                status.className = 'error';
                status.textContent = 'Failed to save account data. HTTP error status: ' + addAccountResponse.status;
              }
            } catch (err) {
              status.className = 'error';
              status.textContent = 'Failed to save account data: ' + err.message;
            }
          },
          onExit: (err, metadata) => {
            status.className = 'error';
            status.textContent = 'Link exited: ' + (err && err.error_message ? err.error_message : 'unknown error');
          },
        });
        handler.open();
      } catch (err) {
        status.className = 'error';
        status.textContent = 'Error: ' + err.message;
      }
    });

    // ---- Sync page: render sync history ----
    function formatTimestamp(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleString();
    }

  // Track state across renders for expand/collapse behavior
  let _prevSeen = new Set();
  let _prevExpanded = new Set();
  let _prevComplete = new Set();

  async function renderHistory() {
      const [historyRes, accountsRes] = await Promise.all([
        fetch('/api/sync/history'),
        fetch('/api/accounts'),
      ]);
      const history = await historyRes.json();
      const accounts = await accountsRes.json();

      const tbody = document.querySelector('#history-table tbody');
      const table = document.querySelector('#history-table');
      if (history.length === 0) {
        table.style.display = 'none';
        tbody.innerHTML = '';
        return;
      }
      table.style.display = '';

      // Capture which rows the user currently has expanded or collapsed (before wiping tbody)
      const existingMainRows = Array.from(tbody.querySelectorAll('tr'));
      const userExpanded = new Set();
      const userCollapsed = new Set();
      for (let i = 0; i < existingMainRows.length; i++) {
        const mainRow = existingMainRows[i];
        const detailsRow = mainRow.nextElementSibling;
        if (detailsRow && detailsRow.getAttribute('data-is-details') === 'true') {
          const syncId = parseInt(mainRow.getAttribute('data-idx'), 10);
          const entry = history.find(e => e.sync_id === syncId);
          if (!entry) continue;
          const visible = detailsRow.querySelector('.history-details')
                          .classList.contains('visible');
          const wasNew = !_prevSeen.has(syncId);
          const wasComplete = _prevComplete.has(syncId);
          // If it's a row we already saw (not new, not just completed), track user interaction
          if (!wasNew && !(_prevComplete.has(syncId) && entry.complete && !wasComplete)) {
            if (visible) {
              userExpanded.add(syncId);
            } else {
              userCollapsed.add(syncId);
            }
          }
        }
      }

      // Rebuild all rows (history is most-recent-first, append in reverse so most recent is first)
      tbody.innerHTML = '';
      for (let i = history.length - 1; i >= 0; i--) {
        const entry = history[i];
        const row = createRow(entry, accounts);
        tbody.appendChild(row.mainRow);
        tbody.appendChild(row.detailsRow);
      }

      // Decide which rows to expand
      const allMainRows = Array.from(tbody.querySelectorAll('tr'));
      for (let i = 0; i < allMainRows.length; i++) {
        const mainRow = allMainRows[i];
        const detailsRow = mainRow.nextElementSibling;
        if (detailsRow && detailsRow.getAttribute('data-is-details') === 'true') {
          const syncId = parseInt(mainRow.getAttribute('data-idx'), 10);
          const entry = history.find(e => e.sync_id === syncId);
          if (!entry) continue;

          const isNew = !_prevSeen.has(syncId);
          const wasPreviouslyComplete = _prevComplete.has(syncId);
          const justCompleted = entry.complete && !wasPreviouslyComplete;

          // Expand defaults:
          // - New rows → expand (first time seeing this sync_id)
          // - User-expanded rows → keep expanded
          // - Previously seen, in-progress, not just completed → expand (user had it open)
          // Don't re-expand rows the user collapsed
          const userCollapsedIt = userCollapsed.has(syncId);
          const shouldExpand = (
            !userCollapsedIt && !justCompleted && (
              isNew ||
              userExpanded.has(syncId) ||
              _prevSeen.has(syncId)
            )
          );

          if (shouldExpand) {
            detailsRow.querySelector('.history-details').classList.add('visible');
            mainRow.querySelector('.history-toggle').textContent = '\u25B2';
          }
          // Track which were expanded this render
          if (shouldExpand) {
            _prevExpanded.add(syncId);
          }
        }
      }

      // Update tracked state for next render
      _prevSeen.clear();
      _prevComplete.clear();
      for (const mainRow of allMainRows) {
        const detailsRow = mainRow.nextElementSibling;
        if (detailsRow && detailsRow.getAttribute('data-is-details') === 'true') {
          const syncId = parseInt(mainRow.getAttribute('data-idx'), 10);
          _prevSeen.add(syncId);
          const entry = history.find(e => e.sync_id === syncId);
          if (entry && entry.complete) {
            _prevComplete.add(syncId);
          }
        }
      }
    }


    function displayAccount(accountId, accounts) {
      const acct = accounts.find(a => a.account_id === accountId);
      if (acct) {
        return acct.institution + " - " + acct.name + " (" + acct.mask + ")";
      }
      return accountId || '—';
    }

    function getLastLogEntry(entry) {
      // Support both old format (plain string) and new format ({message, timestamp})
      const last = entry.logs[entry.logs.length - 1];
      if (!last) return null;
      if (typeof last === 'string') {
        return { message: last, timestamp: '' };
      }
      return last;
    }

    function createRow(entry, accounts) {
      const mainRow = document.createElement('tr');
      mainRow.setAttribute("data-idx", entry.sync_id);
      if (entry.logs.length === 0) {
        mainRow.className = 'queued-row';
      } else if (entry.success && entry.complete) {
        mainRow.className = 'success-row';
      } else if (!entry.complete) {
        mainRow.className = 'in-progress-row';
      } else {
        mainRow.className = 'failure-row';
      }

      // Toggle button
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'history-toggle';
      toggleBtn.textContent = '\u25BC';
      const tdToggle = document.createElement('td');
      tdToggle.appendChild(toggleBtn);
      mainRow.appendChild(tdToggle);

      // Timestamp column (left-most after toggle)
      const lastEntry = getLastLogEntry(entry);
      const tdTimestamp = document.createElement('td');
      tdTimestamp.className = 'history-timestamp';
      tdTimestamp.textContent = lastEntry ? formatTimestamp(lastEntry.timestamp) : '';
      mainRow.appendChild(tdTimestamp);

      // Account column
      const tdAccount = document.createElement('td');
      tdAccount.textContent = displayAccount(entry.account_id, accounts);
      mainRow.appendChild(tdAccount);

      // Status column (text of latest log)
      const tdStatus = document.createElement('td');
      const lastLogText = lastEntry ? lastEntry.message : '';
      tdStatus.textContent = lastLogText.length > 13 ? lastLogText.slice(0, 11) + '...' : lastLogText;
      mainRow.appendChild(tdStatus);

      // Details row with full log list (each log shows its timestamp)
      const detailsRow = document.createElement('tr');
      detailsRow.setAttribute('data-is-details', 'true');
      const detailsTd = document.createElement('td');
      detailsTd.colSpan = 4;
      const ul = document.createElement('ul');
      ul.className = 'history-details';
      for (const log of entry.logs) {
        const li = document.createElement('li');
        let msg, ts;
        if (typeof log === 'string') {
          msg = log;
          ts = '';
        } else {
          msg = log.message;
          ts = log.timestamp ? formatTimestamp(log.timestamp) : '';
        }
        li.textContent = (ts ? ts + ' ' : '') + msg;
        ul.appendChild(li);
      }
      detailsTd.appendChild(ul);
      detailsRow.appendChild(detailsTd);

      toggleBtn.addEventListener('click', () => {
        const details = detailsRow.querySelector('.history-details');
        if (details) {
          const vis = details.classList.toggle('visible');
          toggleBtn.textContent = vis ? '\u25B2' : '\u25BC';
        }
      });

      return { mainRow, detailsRow };
    }


    async function watchForComplete() {
      const statusEl = document.getElementById('status');
      while (true) {
        await new Promise(r => setTimeout(r, 1000));
        const res = await fetch('/api/sync/history');
        const history = await res.json();
        renderHistory();
        statusEl.textContent = '';
        if (history.length > 0 && history[history.length - 1].complete) {
          return;
        }
      }
    }

    document.getElementById('sync-all').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.textContent = 'Request sync for all accounts';
      status.className = '';
      try {
        const res = await fetch('/api/sync/run', { method: 'POST' });
        if (res.ok) {
          watchForComplete();
        } else {
          const body = await res.json();
          status.className = 'error';
          status.textContent = body.error || 'Sync failed';
        }
      } catch (err) {
        status.className = 'error';
        status.textContent = 'Error: ' + err.message;
      }
    });


    showPage(pageMap[route] || 'sync');
  </script>
</body>
</html>
